<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI</title>
<style>
/* Avalanche's AI Chat overlay, ported verbatim to docsy's container language.
   Palette = Themes/Dark.xaml: PaneBrush #3a3a3a, RowHoverBrush #404040,
   CardBorderBrush #2e2e2e, PrimaryBrush #1ea54c, TextBrush #e0e0e0,
   MutedTextBrush #a0a0a0, DimTextBrush #6a6a6a, DangerRed #ef4444,
   SelectionBg #1c5e38. The panel itself paints NOTHING behind the words:
   SidebarPaneBrush is transparent outside 98SE, so the window's grain field
   shows through (the WebView's own background is alpha 0) - the same surface
   the pages rail sits on. The overlays keep BackgroundBrush #1c1c1c. */
:root{
  --bg:#1c1c1c; --pane:#3a3a3a; --rowhover:#404040; --line:#2e2e2e;
  --primary:#1ea54c; --onprimary:#0a0a0a; --text:#e0e0e0; --muted:#a0a0a0;
  --dim:#6a6a6a; --danger:#ef4444; --selbg:#1c5e38;
  --user-ava:rgba(224,224,224,.12); --bot-ava:rgba(30,165,76,.25);
  --user-bg:rgba(30,165,76,.14); --bot-bg:rgba(224,224,224,.07);
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%; overflow:hidden;}
body{
  background:transparent; color:var(--text);
  font-family:"Segoe UI","Segoe UI Emoji",sans-serif; font-size:12px;
  -webkit-user-select:none; user-select:none; cursor:default;
}
#app{display:flex; flex-direction:column; height:100%;}
::-webkit-scrollbar{width:10px;}
::-webkit-scrollbar-thumb{background:#3a3a3a; border-radius:5px; border:2px solid transparent;}
::-webkit-scrollbar-thumb:hover{background:#4a4a4a;}
::-webkit-scrollbar-track{background:transparent;}

/* ---- header (the XAML's row 0): robot + title + 24px icon buttons ---- */
#hdr{flex:0 0 auto; border-bottom:1px solid var(--line); padding:4px 12px;}
#hdr .row{display:flex; align-items:center; gap:8px; min-height:28px;}
#hdr .row .title{font-size:12px; font-weight:600; color:var(--text); flex:1;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
#hdr svg{flex:0 0 auto;}
.ibtn{width:24px; height:24px; border:0; background:transparent; color:var(--muted);
  border-radius:4px; font-family:"Segoe MDL2 Assets"; font-size:10px;
  display:flex; align-items:center; justify-content:center; cursor:pointer; flex:0 0 auto;}
.ibtn:hover{background:var(--rowhover); color:var(--text);}
.ibtn.on{color:var(--primary);}
.ibtn.ready{color:#27ae60;}
.ibtn:disabled{opacity:.35; cursor:default; background:transparent;}
#ctxTitle{font-size:11px; color:var(--muted); margin:2px 0 0 24px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}

/* ---- archive banner ---- */
#archive{display:none; padding:5px 12px; background:var(--pane);
  border-bottom:1px solid var(--line); color:var(--muted); font-size:11px;
  align-items:center; gap:8px;}
#archive button{color:var(--primary);}

/* ---- conversation ---- */
#chatWrap{flex:1 1 auto; display:flex; flex-direction:column; min-height:0; position:relative;}
#msgs{flex:1 1 auto; overflow-y:auto; padding:8px 8px 0 8px;}
.msg{display:flex; align-items:flex-start; margin:0 0 8px 0;}
.msg .ava{width:28px; height:28px; border-radius:50%; margin:2px 8px 0 0;
  display:flex; align-items:center; justify-content:center; flex:0 0 auto;
  box-shadow:0 1px 4px rgba(0,0,0,.3);}
.msg .ava svg{display:block;}
.msg .cell{flex:1 1 auto; min-width:0; display:flex; flex-direction:column; align-items:flex-start;}
.msg.user{flex-direction:row-reverse;}
.msg.user .ava{margin:2px 0 0 8px;}
.msg.user .cell{align-items:flex-end;}
.bubble{max-width:100%; border-radius:8px; padding:8px 10px; margin:0 0 4px 0;
  border:1px solid var(--line); overflow-wrap:break-word; user-select:text; cursor:auto;}
.msg.user .bubble{background:var(--user-bg); text-align:left;}
.msg.bot .bubble{background:var(--bot-bg);}
.msg.bot .bubble p{text-align:justify;}
.think,.errbox{border-radius:8px; padding:6px 10px; margin:0 0 4px 0;
  background:var(--pane); border:1px solid var(--line);
  display:flex; align-items:center; gap:6px; max-width:100%;}
.think .spin{width:14px; height:14px; border:2px solid var(--primary);
  border-radius:50%; animation:rot 1s linear infinite; flex:0 0 auto;}
@keyframes rot{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.think span{color:var(--muted);}
.errbox{border-color:var(--danger); color:var(--danger); display:block;}

/* markdown */
.bubble p{margin:0 0 6px; line-height:1.45;}
.bubble p:last-child{margin-bottom:0;}
.bubble h1,.bubble h2,.bubble h3,.bubble h4,.bubble h5,.bubble h6{
  color:var(--primary); font-weight:600; margin:6px 0 3px; line-height:1.3;}
.bubble h1{font-size:14.5px;} .bubble h2{font-size:13px;} .bubble h3,.bubble h4,.bubble h5,.bubble h6{font-size:11.5px;}
.bubble code{font-family:Consolas,"Courier New",monospace; font-size:11px;
  background:var(--rowhover); border-radius:3px; padding:1px 4px;}
.bubble pre{background:var(--rowhover); border:1px solid var(--line); border-radius:4px;
  padding:6px 8px; margin:4px 0 6px; overflow-x:auto;}
.bubble pre code{background:transparent; padding:0;}
.bubble ul,.bubble ol{margin:0 0 6px; padding-left:20px;}
.bubble li{margin:0 0 2px; text-align:justify;}
.bubble blockquote{border-left:2px solid var(--line); padding:2px 8px; margin:4px 0 6px;
  color:var(--muted); font-style:italic;}
.bubble hr{border:0; border-top:1px solid var(--line); margin:6px 0;}
.bubble a{color:var(--primary);}
.cite{display:inline-flex; align-items:center; justify-content:center;
  min-width:16px; height:16px; padding:0 3px; margin:0 3px; vertical-align:1px;
  border-radius:8px; font-size:9.5px; font-weight:600; color:var(--text);
  background:rgba(136,136,136,.28); border:1px solid var(--muted); cursor:pointer;}
.cite:hover{opacity:.75;}
.cite.dead{opacity:.38; cursor:default;}

/* ---- empty state: the invitation shows the moment the panel opens - the
     first user message sweeps it away (setEmpty) ---- */
#empty{position:absolute; inset:0; display:flex; flex-direction:column;
  align-items:center; justify-content:center; margin:0 24px; pointer-events:none;}
#empty .t1{font-size:13px; font-weight:600; color:var(--text); margin-top:12px;}
#empty .t2{font-size:11px; color:var(--muted); margin-top:5px; text-align:center;
  max-width:270px; line-height:16px;}

/* ---- status strips ---- */
.strip{flex:0 0 auto; padding:5px 12px; font-size:11px; color:var(--muted); display:none;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
#idxStrip{border-top:1px solid var(--line);}
#durLine{display:flex; justify-content:space-between; gap:12px; padding:3px 12px;}

/* ---- composer ---- */
#composer{flex:0 0 auto; display:flex; gap:8px; padding:8px; border-top:1px solid var(--line);}
#input{flex:1 1 auto; background:var(--pane); border:1px solid var(--line); border-radius:4px;
  color:var(--text); font-family:inherit; font-size:12px; padding:6px 10px;
  resize:none; min-height:38px; max-height:120px; outline:none; user-select:text;}
#input::placeholder{color:var(--dim);}
.sbtn{width:36px; height:36px; flex:0 0 auto; border:1px solid var(--line); border-radius:4px;
  background:var(--pane); color:var(--text); font-family:"Segoe MDL2 Assets"; font-size:14px;
  display:none; align-items:center; justify-content:center; cursor:pointer;}
.sbtn:hover{background:var(--rowhover);}
.sbtn:disabled{opacity:.35; cursor:default;}

/* ---- overlays (settings / history): opaque seats over the conversation ---- */
.ovl{position:absolute; inset:0; background:var(--bg); border-top:1px solid var(--line);
  display:none; flex-direction:column; z-index:60;}
.ovl .obody{flex:1 1 auto; overflow-y:auto; padding:8px 12px;}
.ovl .ohead{display:flex; align-items:center; gap:8px; padding:6px 12px;
  border-bottom:1px solid var(--line); font-size:12px; font-weight:600;}
.flabel{font-size:11px; color:var(--muted); margin:6px 0 2px;}
.fbox{width:100%; background:var(--pane); border:1px solid var(--line); border-radius:3px;
  color:var(--text); font-size:11px; padding:4px 6px; outline:none; font-family:inherit; user-select:text;}
.fbox:focus{border-color:var(--primary);}
.abtn{background:var(--pane); border:1px solid var(--line); color:var(--text);
  font-size:11.5px; border-radius:3px; padding:5px 12px; cursor:pointer; font-family:inherit;}
.abtn:hover{background:var(--rowhover);}
.abtn.primary{background:var(--primary); border-color:var(--primary); color:var(--onprimary); font-weight:600;}
#cloudNote{display:none; margin-top:8px; font-size:11px; color:var(--danger);
  border:1px solid var(--danger); border-radius:3px; padding:6px 8px;}
#testOut{font-size:11px; color:var(--muted); margin-top:6px; white-space:pre-wrap;}

/* ---- history rows ---- */
.hsec{font-size:11px; color:var(--dim); margin:10px 0 4px; font-weight:600;
  text-transform:uppercase; letter-spacing:.4px;}
.hrow{display:flex; align-items:center; gap:8px; padding:6px 8px; border-radius:4px; cursor:pointer;}
.hrow:hover{background:var(--rowhover);}
.hrow .t{flex:1 1 auto; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.hrow .m{font-size:10px; color:var(--dim); flex:0 0 auto;}
.hrow .cur{font-size:10px; color:var(--primary); border:1px solid var(--primary);
  border-radius:8px; padding:0 6px; flex:0 0 auto;}
.hrow .del{color:var(--muted); flex:0 0 auto; width:22px; height:22px; border:0;
  background:transparent; font-family:"Segoe MDL2 Assets"; font-size:10px; cursor:pointer; border-radius:4px;}
.hrow .del:hover{color:var(--danger); background:var(--pane);}
#histEmpty{font-size:11px; color:var(--muted); margin:12px 8px; text-align:center;}

/* the panel's own text sits straight on the grain, like the reference's rail
text does - no opaque card behind it */
</style>
</head>
