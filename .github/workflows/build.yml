name: build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build
        shell: cmd
        run: rc /nologo /fo src\docsy.res src\docsy.rc && cl /nologo /std:c++20 /EHsc /O1 /GL /MT /DNDEBUG /DUNICODE /D_UNICODE /Fe:docsy.exe src\main.cpp src\docsy.res /link /SUBSYSTEM:WINDOWS /OPT:REF /OPT:ICF /LTCG /MANIFEST:EMBED /MANIFESTINPUT:src\app.manifest > build.log 2>&1
      - name: Show build log
        if: always()
        shell: bash
        run: cat build.log || true
      - name: Preview
        id: preview
        continue-on-error: true
        shell: pwsh
        run: |
          python ci/make_sample.py sample.pdf
          $p = Start-Process .\docsy.exe -ArgumentList '--shot',"$PWD\preview.png","$PWD\sample.pdf",'sel=0:0:999','find=Windows','zoom=35' -Wait -PassThru
          "exit code: $($p.ExitCode)" | Tee-Object shot.log
          $d = Start-Process .\docsy.exe -ArgumentList '--shot',"$PWD\preview-default.png","$PWD\sample.pdf" -Wait -PassThru
          "default exit code: $($d.ExitCode)" | Tee-Object -Append shot.log
          $q = Start-Process .\docsy.exe -ArgumentList '--shot',"$PWD\preview-empty.png",'-' -Wait -PassThru
          "empty exit code: $($q.ExitCode)" | Tee-Object -Append shot.log
          $s2 = Start-Process .\docsy.exe -ArgumentList '--shot',"$PWD\preview-split.png","$PWD\sample.pdf",'split=on' -Wait -PassThru
          "split exit code: $($s2.ExitCode)" | Tee-Object -Append shot.log
          $i2 = Start-Process .\docsy.exe -ArgumentList '--shot',"$PWD\preview-info.png","$PWD\sample.pdf",'info=open' -Wait -PassThru
          "info exit code: $($i2.ExitCode)" | Tee-Object -Append shot.log
          if (!(Test-Path preview.png)) { exit 1 }
      - name: Publish
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=""
          for f in docsy.exe preview.png preview-default.png preview-empty.png preview-split.png preview-info.png build.log shot.log sample.pdf; do if [ -s "$f" ]; then files="$files $f"; fi; done
          set +e
          gh release create "build-$GITHUB_RUN_NUMBER" $files --target "$GITHUB_SHA" --latest --title "Docsy build $GITHUB_RUN_NUMBER" --notes "Portable single-file exe." > release.log 2>&1
          echo "release exit: $?" >> release.log
          mkdir dist && cp $files release.log dist/ && cd dist
          git init -q -b dist && git config user.name ci && git config user.email ci@users.noreply.github.com
          git add -A && git commit -qm "build $GITHUB_RUN_NUMBER"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" dist
