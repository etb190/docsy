name: build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: WebView2 SDK
        shell: cmd
        run: |
          curl -sSL -o wv2.zip https://www.nuget.org/api/v2/package/Microsoft.Web.WebView2
          mkdir wv2 && tar -xf wv2.zip -C wv2
          if not exist wv2\build\native\include\webview2.h exit 1
          if not exist wv2\build\native\x64\WebView2LoaderStatic.lib exit 1
      - name: Build
        shell: cmd
        run: rc /nologo /fo src\docsy.res src\docsy.rc && cl /nologo /std:c++20 /EHsc /O1 /GL /MT /DNDEBUG /DUNICODE /D_UNICODE /I"wv2\build\native\include" /Fe:docsy.exe src\main.cpp src\docsy.res /link /SUBSYSTEM:WINDOWS /OPT:REF /OPT:ICF /LTCG /MANIFEST:EMBED /MANIFESTINPUT:src\app.manifest /LIBPATH:"wv2\build\native\x64" WebView2LoaderStatic.lib advapi32.lib > build.log 2>&1
      - name: Show build log
        if: always()
        shell: bash
        run: cat build.log || true
      - name: Extension self-test
        if: always()
        shell: pwsh
        run: |
          $bt = "$env:RUNNER_TEMP\wv2setup.exe"
          Invoke-WebRequest 'https://go.microsoft.com/fwlink/?linkid=2124701' -OutFile $bt
          Start-Process $bt -ArgumentList '/silent','/install' -Wait
          "webview2 runtime: $((Get-ItemProperty 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}' -ErrorAction SilentlyContinue).pv)" | Out-File extlog.txt
          $mv3 = Start-Process .\docsy.exe -ArgumentList '--exttest','ddkjiahejlhfcafbddmgiahcphecmpfh','out=exttest-ubolite.txt' -Wait -PassThru
          "uBlock Origin Lite (mv3) exit: $($mv3.ExitCode)" | Out-File -Append extlog.txt
          $mv2 = Start-Process .\docsy.exe -ArgumentList '--exttest','dhdgffkkebhmkfjojejmpbldmpobfkfo','out=exttest-tampermonkey.txt' -Wait -PassThru
          "Tampermonkey (mv2) exit: $($mv2.ExitCode)" | Out-File -Append extlog.txt
          foreach ($f in 'exttest-ubolite.txt','exttest-tampermonkey.txt') { if (Test-Path $f) { "----- $f -----" | Out-File -Append extlog.txt; Get-Content $f | Out-File -Append extlog.txt } }
          if ($mv3.ExitCode -ne 0) { exit 1 }
      - name: Preview
        id: preview
        continue-on-error: true
        shell: pwsh
        run: |
          python ci/make_sample.py sample.pdf
          $p = Start-Process .\docsy.exe -ArgumentList '--shot',"$PWD\preview.png","$PWD\sample.pdf",'sel=0:0:999','find=Windows','zoom=35' -Wait -PassThru
          "exit code: $($p.ExitCode)" | Tee-Object shot.log
          $d = Start-Process .\docsy.exe -ArgumentList '--shot',"$PWD\preview-default.png","$PWD\sample.pdf" -Wait -PassThru
          "default exit code: $($d.ExitCode)" | Tee-Object -Append shot.log
          $q = Start-Process .\docsy.exe -ArgumentList '--shot',"$PWD\preview-empty.png",'-' -Wait -PassThru
          "empty exit code: $($q.ExitCode)" | Tee-Object -Append shot.log
          $s2 = Start-Process .\docsy.exe -ArgumentList '--shot',"$PWD\preview-split.png","$PWD\sample.pdf",'split=on' -Wait -PassThru
          "split exit code: $($s2.ExitCode)" | Tee-Object -Append shot.log
          $i2 = Start-Process .\docsy.exe -ArgumentList '--shot',"$PWD\preview-info.png","$PWD\sample.pdf",'info=open' -Wait -PassThru
          "info exit code: $($i2.ExitCode)" | Tee-Object -Append shot.log
          $t2 = Start-Process .\docsy.exe -ArgumentList '--shot',"$PWD\preview-tools.png","$PWD\sample.pdf",'annot=demo','tool=5' -Wait -PassThru
          "tools exit code: $($t2.ExitCode)" | Tee-Object -Append shot.log
          $x1 = Start-Process .\docsy.exe -ArgumentList '--shot',"$PWD\preview-textbar.png","$PWD\sample.pdf",'tool=1' -Wait -PassThru
          "textbar exit code: $($x1.ExitCode)" | Tee-Object -Append shot.log
          $x2 = Start-Process .\docsy.exe -ArgumentList '--shot',"$PWD\preview-shapebar.png","$PWD\sample.pdf",'annot=demo','tool=4' -Wait -PassThru
          "shapebar exit code: $($x2.ExitCode)" | Tee-Object -Append shot.log
          $x3 = Start-Process .\docsy.exe -ArgumentList '--shot',"$PWD\preview-hlbar.png","$PWD\sample.pdf",'annot=demo','tool=2' -Wait -PassThru
          "hlbar exit code: $($x3.ExitCode)" | Tee-Object -Append shot.log
          $as = Start-Process .\docsy.exe -ArgumentList '--shot',"$PWD\preview-ask.png","$PWD\sample.pdf",'annot=demo','ask=save' -Wait -PassThru
          "ask exit code: $($as.ExitCode)" | Tee-Object -Append shot.log
          $b2 = Start-Process .\docsy.exe -ArgumentList '--shot',"$PWD\preview-split2.png","$PWD\sample.pdf",'split=on',"fileB=$PWD\sample.pdf",'zoom=35' -Wait -PassThru
          "split2 exit code: $($b2.ExitCode)" | Tee-Object -Append shot.log
          Copy-Item "$PWD\sample.pdf" "$PWD\sample-b.pdf"
          $tb = Start-Process .\docsy.exe -ArgumentList '--shot',"$PWD\preview-tabs.png","$PWD\sample.pdf",'annot=demo',"tab2=$PWD\sample-b.pdf" -Wait -PassThru
          "tabs exit code: $($tb.ExitCode)" | Tee-Object -Append shot.log
          $wv = Start-Process .\docsy.exe -ArgumentList '--shot',"$PWD\preview-web.png","$PWD\sample.pdf",'web=1' -Wait -PassThru
          "web exit code: $($wv.ExitCode)" | Tee-Object -Append shot.log
          $sv = Start-Process .\docsy.exe -ArgumentList '--shot',"$PWD\preview-save.png","$PWD\sample.pdf",'annot=demo',"save=$PWD\saved.pdf" -Wait -PassThru
          "save exit code: $($sv.ExitCode)" | Tee-Object -Append shot.log
          $ro = Start-Process .\docsy.exe -ArgumentList '--shot',"$PWD\preview-reopen.png","$PWD\saved.pdf" -Wait -PassThru
          "reopen exit code: $($ro.ExitCode)" | Tee-Object -Append shot.log
          python ci/make_sample.py big.pdf 30
          $bg = Start-Process .\docsy.exe -ArgumentList '--shot',"$PWD\preview-big.png","$PWD\big.pdf",'annot=demo',"save=$PWD\saved-big.pdf" -Wait -PassThru
          "big save exit code: $($bg.ExitCode)" | Tee-Object -Append shot.log
          $bro = Start-Process .\docsy.exe -ArgumentList '--shot',"$PWD\preview-big-reopen.png","$PWD\saved-big.pdf" -Wait -PassThru
          "big reopen exit code: $($bro.ExitCode)" | Tee-Object -Append shot.log
          $lock = [System.IO.File]::Open("$PWD\saved.pdf",'Open','Read','Read')
          $lk = Start-Process .\docsy.exe -ArgumentList '--shot',"$PWD\preview-locked.png","$PWD\sample.pdf",'annot=demo',"save=$PWD\saved.pdf" -Wait -PassThru
          "locked save exit code: $($lk.ExitCode)" | Tee-Object -Append shot.log
          $lock.Close()
          "saved.pdf still good: $((Get-Item "$PWD\saved.pdf").Length -gt 100000)" | Tee-Object -Append shot.log
          if (!(Test-Path preview.png)) { exit 1 }
      - name: Publish
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=""
          for f in docsy.exe preview.png preview-default.png preview-empty.png preview-split.png preview-info.png preview-tools.png preview-textbar.png preview-shapebar.png preview-hlbar.png preview-ask.png preview-split2.png preview-tabs.png preview-web.png preview-save.png preview-reopen.png saved.pdf preview-big.png preview-big-reopen.png saved-big.pdf preview-locked.png build.log shot.log sample.pdf extlog.txt exttest-ubolite.txt exttest-tampermonkey.txt; do if [ -s "$f" ]; then files="$files $f"; fi; done
          set +e
          gh release create "build-$GITHUB_RUN_NUMBER" $files --target "$GITHUB_SHA" --latest --title "Docsy build $GITHUB_RUN_NUMBER" --notes "Portable single-file exe." > release.log 2>&1
          echo "release exit: $?" >> release.log
          mkdir dist && cp $files release.log dist/ && cd dist
          git init -q -b dist && git config user.name ci && git config user.email ci@users.noreply.github.com
          git add -A && git commit -qm "build $GITHUB_RUN_NUMBER"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" dist
